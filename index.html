<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dramione Library</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 🌌 ПЫЛЬ -->
    <canvas id="dustCanvas"></canvas>

    <!-- 🦁 ЛЕВ -->
    <svg id="lion" viewBox="0 0 300 300">
        <path d="M40,200 L80,120 L120,160 L160,80 L200,140 L240,100"
              stroke="#d6b25e"
              stroke-width="1.5"
              fill="none"
              opacity="0.7"/>
    </svg>

    <!-- 🐉 ДРАКОН -->
    <svg id="dragon" viewBox="0 0 300 300">
        <path d="M60,120 L100,180 L140,140 L180,200 L220,130 L260,170"
              stroke="#d6b25e"
              stroke-width="1.5"
              fill="none"
              opacity="0.7"/>
    </svg>

    <!-- ✨ СЦЕНА -->
    <div id="scene">
        <h1 id="title"></h1>
        <div id="quote"></div>
        <button id="door">ENTER</button>
    </div>

    <script src="js/main.js"></script>

</body>

</html>
