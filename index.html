<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинематографичный Портал</title>
    <!-- Подключаем изящный serif-шрифт для названия и тонкий рукописный для цитаты -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050303;
            font-family: 'Cinzel', serif;
        }

        /* 🌌 Рассеянный свет на заднем фоне */
        .ambient-glow {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at center, rgba(214, 178, 94, 0.07) 0%, transparent 60%),
                radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
            pointer-events: none;
            z-index: 1;
        }

        /* Холст для золотых частиц пыли и взрыва */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Главный контейнер сцены */
        #scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3;
        }

        /* 🔥 Эффект вспышки при взрыве названия */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }
        .flash-overlay.active {
            animation: flashAnim 1s ease-out forwards;
        }
        @keyframes flashAnim {
            0% { opacity: 0.8; filter: blur(0px); }
            100% { opacity: 0; filter: blur(20px); }
        }

        /* 👑 Название сайта */
        #title {
            font-size: 56px;
            letter-spacing: 12px;
            color: #d6b25e;
            font-weight: 700;
            text-shadow: 0 0 35px rgba(214, 178, 94, 0.4);
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 1.5s cubic-bezier(0.1, 0.8, 0.2, 1), transform 1.5s cubic-bezier(0.1, 0.8, 0.2, 1);
        }
        #title.reveal {
            opacity: 1;
            transform: scale(1);
        }

        /* 📜 Цитата (Тонкий рукописный шрифт "Росчерк пера") */
        #quote-container {
            margin-top: 40px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .quote-text {
            font-family: 'Pinyon Script', cursive;
            font-size: 38px;
            color: rgba(214, 178, 94, 0.85);
            letter-spacing: 2px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 1px solid rgba(214, 178, 94, 0.75); /* Имитация кончика пера */
            width: 0;
        }
        /* Анимация проявления пера */
        .quote-text.write {
            animation: 
                typing 3.5s steps(40, end) forwards,
                blink-caret 0.75s step-end infinite;
        }
        /* Эффект рассыпания текста цитаты через растворение */
        .quote-text.dissolve {
            animation: dissolveAnim 1.5s ease-in-out forwards;
            border-right: none;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: rgba(214, 178, 94, 0.75); }
        }
        @keyframes dissolveAnim {
            0% { opacity: 1; filter: blur(0px); transform: scale(1); }
            100% { opacity: 0; filter: blur(15px); transform: scale(1.05); }
        }

        /* 🔑 Кнопка Войти (Энтер) */
        #door {
            position: absolute;
            padding: 14px 36px;
            border: 1px solid rgba(214, 178, 94, 0.5);
            background: transparent;
            color: #d6b25e;
            font-size: 16px;
            letter-spacing: 4px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.9);
            box-shadow: 0 0 0px rgba(214, 178, 94, 0);
            pointer-events: none;
            transition: 
                opacity 2s ease, 
                transform 2s ease, 
                background 0.4s ease, 
                box-shadow 0.4s ease, 
                border-color 0.4s ease;
        }
        /* Эффект сборки кнопки из пыли */
        #door.assemble {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            animation: glowPulse 3s infinite alternate;
        }
        #door:hover {
            background: rgba(214, 178, 94, 0.08);
            border-color: rgba(214, 178, 94, 1);
            box-shadow: 0 0 20px rgba(214, 178, 94, 0.2);
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 5px rgba(214, 178, 94, 0.05); }
            100% { box-shadow: 0 0 15px rgba(214, 178, 94, 0.15); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="flash-overlay" id="flash"></div>
    <canvas id="dustCanvas"></canvas>

    <div id="scene">
        <!-- Замените текст на название вашего сайта -->
        <h1 id="title">AURUM</h1> 
        
        <div id="quote-container">
            <!-- Замените текст на вашу цитату -->
            <div class="quote-text" id="quote">The magic begins in the dark...</div>
            <button id="door">ENTER PORTAL</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('dustCanvas');
        const ctx = canvas.getContext('2d');
        const title = document.getElementById('title');
        const flash = document.getElementById('flash');
        const quote = document.getElementById('quote');
        const door = document.getElementById('door');

        // Подгоняем холст под размеры экрана
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Массивы для частиц
        const ambientParticles = [];
        const blastParticles = [];

        // Класс постоянной фоновой золотой пыли
        class AmbientParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // Случайная высота при старте
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.4 + 0.1;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(214, 178, 94, ${this.opacity})`;
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#d6b25e';
                ctx.fill();
            }
        }

        // Класс частиц для взрыва и сборки
        class BlastParticle {
            constructor(x, y, isAssembling = false, targetX = 0, targetY = 0) {
                this.x = x;
                this.y = y;
                this.isAssembling = isAssembling;
                
                if (isAssembling) {
                    // Частицы летят из области цитаты к кнопке
                    this.startX = x;
                    this.startY = y;
                    this.targetX = targetX;
                    this.targetY = targetY;
                    this.progress = 0;
                    this.speed = Math.random() * 0.02 + 0.01;
                    this.size = Math.random() * 2 + 0.5;
                    this.opacity = Math.random() * 0.8 + 0.2;
                } else {
                    // Частицы взрыва названия
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = Math.random() * 3 + 1;
                    this.gravity = 0.02;
                    this.opacity = 1;
                    this.fade = Math.random() * 0.015 + 0.008;
                }
            }
            update() {
                if (this.isAssembling) {
                    this.progress += this.speed;
                    if (this.progress > 1) this.progress = 1;
                    // Плавная интерполяция к цели (кнопке)
                    this.x = this.startX + (this.targetX - this.startX) * this.progress;
                    this.y = this.startY + (this.targetY - this.startY) * this.progress;
                    if(this.progress >= 1) this.opacity -= 0.02; // Исчезают, сливаясь с кнопкой
                } else {
