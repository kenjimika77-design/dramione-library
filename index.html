<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dramione Library</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap');

html, body {
margin: 0;
height: 100%;
overflow: hidden;
font-family: 'Cinzel', serif;
background: radial-gradient(circle at center, #1a120d, #0b0705);
}

/* GOLD DUST BACKGROUND */
body::before {
content: "";
position: absolute;
inset: 0;
background:
radial-gradient(circle at 20% 30%, rgba(255,215,0,0.08), transparent 40%),
radial-gradient(circle at 70% 60%, rgba(255,215,0,0.05), transparent 45%),
radial-gradient(circle at center, rgba(255,255,255,0.02), transparent 60%);
pointer-events: none;
}

/* MAIN */
#scene {
position: relative;
height: 100%;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
}

/* TITLE */
#title {
font-size: 46px;
letter-spacing: 6px;
color: #d6b25e;
opacity: 1;
position: relative;
}

/* soft underline line */
#line {
width: 0%;
height: 1px;
margin-top: 10px;
background: linear-gradient(90deg, transparent, #d6b25e, transparent);
animation: lineGrow 2.5s ease forwards;
}

@keyframes lineGrow {
to { width: 55%; }
}

/* quote */
#quote {
margin-top: 35px;
font-size: 18px;
color: #c8a86a;
opacity: 0;
transform: translateY(10px);
transition: all 2s ease;
}

/* BUTTON */
#door {
margin-top: 50px;
padding: 12px 22px;
border: 1px solid rgba(214,178,94,0.5);
background: rgba(255,255,255,0.03);
color: #d6b25e;
cursor: pointer;

opacity: 0;
transform: scale(0.8);
transition: all 1.2s ease;
}

#door.show {
opacity: 1;
transform: scale(1);
}

#door:hover {
transform: scale(1.05);
background: rgba(214,178,94,0.08);
}

/* GOLD PARTICLES */
.particle {
position: absolute;
width: 3px;
height: 3px;
background: gold;
border-radius: 50%;
opacity: 0.3;
animation: float 6s infinite ease-in-out;
}

@keyframes float {
0%,100% { transform: translateY(0); opacity: 0.2; }
50% { transform: translateY(-25px); opacity: 0.6; }
}

/* TEXT APPEAR (dust effect) */
.fade-letter {
display: inline-block;
opacity: 0;
transform: translateY(10px);
filter: blur(6px);
animation: appear 1s forwards;
}

@keyframes appear {
to {
opacity: 1;
transform: translateY(0);
filter: blur(0);
}
}
</style>
</head>

<body>

<div id="scene">

<div id="title"></div>

<div id="line"></div>

<div id="quote">Every library keeps secrets. Some are darker than others.</div>

<div id="door">🔑 Alohomora (Open the door)</div>

</div>

<script>

const titleText = "Dramione Library";
const title = document.getElementById("title");
const quote = document.getElementById("quote");
const door = document.getElementById("door");

/* ✨ TITLE FROM DUST */
titleText.split("").forEach((char, i) => {
  const span = document.createElement("span");
  span.textContent = char;
  span.className = "fade-letter";
  span.style.animationDelay = (i * 0.06) + "s";
  title.appendChild(span);
});

/* line already animates via CSS */

/* quote appears AFTER title */
setTimeout(() => {
  quote.style.opacity = 1;
  quote.style.transform = "translateY(0)";
}, 2200);

/* button appears FROM dust */
setTimeout(() => {
  door.classList.add("show");
}, 3800);

/* gold particles */
for (let i = 0; i < 70; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.top = Math.random() * 100 + "%";
  p.style.left = Math.random() * 100 + "%";
  p.style.animationDelay = Math.random() * 5 + "s";
  document.body.appendChild(p);
}

/* portal action */
door.onclick = () => {
  document.body.style.transition = "opacity 1.2s ease";
  document.body.style.opacity = "0";

  setTimeout(() => {
    alert("The door opens… next step: we build the library interior worlds.");
  }, 1200);
};

</script>

</body>
</html>
