<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dramione Library</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap');

html, body {
margin: 0;
height: 100%;
overflow: hidden;
font-family: 'Cinzel', serif;
background: #f3ead7;
}

/* parchment */
body::before {
content: "";
position: absolute;
inset: 0;
background: radial-gradient(circle at center, rgba(255,255,255,0.4), rgba(0,0,0,0.15)),
url('https://i.imgur.com/3ZQ3Z9Y.jpg');
background-size: cover;
opacity: 0.9;
filter: contrast(1.05) brightness(1.05);
}

/* center container */
#scene {
position: relative;
height: 100%;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
padding: 40px;
}

/* quote */
#quote {
font-size: 22px;
opacity: 0;
color: #3b2f1f;
transition: opacity 2s ease;
}

/* logo */
#title {
margin-top: 20px;
font-size: 34px;
letter-spacing: 3px;
color: #6b4f2a;
opacity: 0;
position: relative;
}

/* gold writing line */
#title::after {
content: "";
position: absolute;
left: 0;
bottom: -5px;
height: 2px;
width: 0%;
background: linear-gradient(90deg, transparent, gold, transparent);
animation: writeLine 3s ease forwards;
}

@keyframes writeLine {
to { width: 100%; }
}

/* bookmarks */
#choices {
margin-top: 60px;
display: flex;
gap: 30px;
opacity: 0;
transition: opacity 2s ease;
}

.bookmark {
padding: 15px 20px;
border: 1px solid rgba(120,90,40,0.4);
background: rgba(255,255,255,0.3);
cursor: pointer;
transition: transform 0.4s, background 0.4s;
font-size: 14px;
color: #4b3a22;
}

.bookmark:hover {
transform: translateY(-5px);
background: rgba(255,255,255,0.6);
}

/* constellations */
.star {
position: absolute;
width: 4px;
height: 4px;
background: gold;
border-radius: 50%;
opacity: 0.15;
animation: twinkle 4s infinite;
}

@keyframes twinkle {
0%,100% { opacity: 0.1; }
50% { opacity: 0.4; }
}

/* page transition */
#pageFlip {
position: fixed;
inset: 0;
background: #f3ead7;
transform: scaleX(0);
transform-origin: left;
transition: transform 1.2s ease;
z-index: 10;
}
</style>
</head>

<body>

<div id="pageFlip"></div>

<div id="scene">

<div id="quote">Every library keeps secrets. Some are darker than others.</div>

<div id="title">Dramione Library</div>

<div id="choices">
<div class="bookmark">📖 Forbidden Love</div>
<div class="bookmark">⚔️ War & Ruin</div>
<div class="bookmark">🌿 Healing & Hope</div>
</div>

</div>

<script>
const quote = document.getElementById("quote");
const title = document.getElementById("title");
const choices = document.getElementById("choices");
const flip = document.getElementById("pageFlip");

/* fade in sequence */
setTimeout(() => quote.style.opacity = 1, 800);

setTimeout(() => {
title.style.opacity = 1;
}, 3000);

setTimeout(() => {
choices.style.opacity = 1;
}, 5500);

/* fake constellations */
for (let i = 0; i < 40; i++) {
const star = document.createElement("div");
star.className = "star";
star.style.top = Math.random()*100 + "%";
star.style.left = Math.random()*100 + "%";
star.style.animationDelay = Math.random()*5 + "s";
document.body.appendChild(star);
}

/* page flip on choice */
document.querySelectorAll(".bookmark").forEach(btn => {
btn.addEventListener("click", () => {
flip.style.transform = "scaleX(1)";
setTimeout(() => {
alert("Page turned. Library opens (next step we build this).");
}, 1200);
});
});
</script>

</body>
</html>
