<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dramione Library - Forbidden Archive">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
   <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        
        <!-- ЛЕВОЕ МЕНЮ (SIDEBAR) -->
        <aside class="sidebar">
            <div class="logo-section">
                <div class="logo-d">D</div>
                <h2>DRAMIONE LIBRARY</h2>
                <p class="subtitle">FORBIDDEN ARCHIVE</p>
            </div>
            
            <nav class="menu">
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-book-open"></i> 
                    <div><span>Archive</span><small>Архив историй</small></div>
                </a>
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 
                    <div><span>Magic Entries</span><small>Магические записи</small></div>
                </a>
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-heart"></i> 
                    <div><span>Love Stories</span><small>Истории любви</small></div>
                </a>
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-moon"></i> 
                    <div><span>Night Section</span><small>Ночные разделы</small></div>
                </a>
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-lock"></i> 
                    <div><span>Restricted</span><small>Запретное</small></div>
                </a>
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-box-archive"></i> 
                    <div><span>Memories</span><small>Воспоминания</small></div>
                </a>
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-envelope"></i> 
                    <div><span>Letters</span><small>Письма</small></div>
                </a>
                <a href="#" class="menu-item">
                    <i class="fa-solid fa-circle-info"></i> 
                    <div><span>About Us</span><small>О нас</small></div>
                </a>
            </nav>
            
            <div class="sidebar-quote">
                Любовь — это магия, которую нельзя изучить, но можно почувствовать.
                <span class="author">— D & H</span>
            </div>
        </aside>

        <!-- ГЛАВНЫЙ КОНТЕНТ -->
        <main class="main-content">
            
            <!-- ХЕДЕР И ЗАГОЛОВОК -->
            <section class="hero">
                <p class="welcome-text">Welcome to our<br>forbidden archive</p>
                <h1 class="main-title">DRAMIONE</h1>
                <div class="cursive-text">forever</div>
                <p class="hero-desc">Два сердца. Два мира. Одна любовь, которую невозможно разрушить.</p>
                <button class="btn-enter">Enter Library <span class="arrow">→</span></button>
            </section>

            <!-- БЛОК НАШИ МОМЕНТЫ -->
            <section class="moments-section">
                <div class="section-divider">
                    <span class="line"></span>
                    <span class="stars">✦ ─── Our Moments ─── ✦</span>
                    <span class="line"></span>
                </div>
                
                <div class="cards-grid">
                    <div class="moment-card">
                <div class="card-img" style="background-image: url('https://placehold.co');"></div>
                        <div class="card-footer">
                            <div>
                                <h4>Первая встреча</h4>
                                <span class="date">14.02.2022</span>
                            </div>
                            <span class="heart"><i class="fa-regular fa-heart"></i></span>
                        </div>
                    </div>
                    <div class="moment-card">
                        <div class="card-img" style="background-image: url('https://placehold.co');"></div>
                        <div class="card-footer">
                            <div>
                                <h4>Ты сказал «Люблю»</h4>
                                <span class="date">07.07.2022</span>
                            </div>
                            <span class="heart"><i class="fa-regular fa-heart"></i></span>
                        </div>
                    </div>
                    <div class="moment-card">
                        <div class="card-img" style="background-image: url('https://placehold.co');"></div>
                        <div class="card-footer">
                            <div>
                                <h4>Навсегда</h4>
                                <span class="date">01.01.2023</span>
                            </div>
                            <span class="heart"><i class="fa-regular fa-heart"></i></span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- НИЖНЯЯ ПАНЕЛЬ (ПЛЕЕР И ПИСЬМО) -->
            <section class="bottom-widgets">
                <!-- Музыкальный плеер -->
                <div class="player-widget">
                    <div class="track-info">
                        <div class="track-cover" style="background-image: url('https://placehold.co');"></div>
                        <div class="track-text">
                            <span class="status">Now Playing</span>
                            <h5>Rewrite The Stars</h5>
                            <p>James Arthur & Anne-Marie</p>
                        </div>
                    </div>
                    <div class="player-controls">
                        <span class="time">1:23</span>
                        <div class="progress-bar"><div class="progress"></div></div>
                        <span class="time">3:37</span>
                    </div>
                    <div class="player-buttons">
                        <button><i class="fa-solid fa-shuffle"></i></button>
                        <button><i class="fa-solid fa-backward-step"></i></button>
                        <button class="play-btn"><i class="fa-solid fa-circle-play"></i></button>
                        <button><i class="fa-solid fa-forward-step"></i></button>
                        <button><i class="fa-solid fa-repeat"></i></button>
                    </div>
                </div>

                <!-- Новое письмо -->
                <div class="letter-widget">
                    <div class="letter-content">
                        <h5>New Letter</h5>
                        <p>У вас новое письмо из Хогвартса</p>
                        <button class="btn-read">Читать <i class="fa-solid fa-pen-nib"></i></button>
                    </div>
                </div>
            </section>
        </main>

        <!-- ПРАВАЯ ПАНЕЛЬ -->
        <aside class="right-bar">
            <div class="quote-day-box">
                <h3>Цитата дня</h3>
                <p class="quote-text">Любовь — это не взгляд друг на друга, а взгляд в одном направлении.</p>
                <span class="author">— Антуан де Сент-Экзюпери</span>
            </div>

            <div class="constellation-box">
                <h3>Constellation of Fate</h3>
            <div class="stars-img" style="background-image: url('https://placehold.co');"></div>
                <p class="constellation-text">Лев и Змея связаны нитями магии, которые невозможно разорвать.</p>
            </div>
        </aside>

    </div>

</body>
</html>
