<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Menu</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap');

body {
  margin: 0;
  font-family: 'Cinzel', serif;
  background: radial-gradient(circle at top, #1a1425, #0b0813);
  overflow: hidden;
  color: #fff;
}

/* фоновые звёзды */
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: float 6s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0px); opacity: 0.2; }
  50% { opacity: 1; }
  100% { transform: translateY(-20px); opacity: 0.2; }
}

/* заголовок */
h1 {
  text-align: center;
  margin-top: 40px;
  font-size: 42px;
  letter-spacing: 2px;
  animation: glow 3s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #a66bff; }
  to { text-shadow: 0 0 25px #ffccff; }
}

/* меню */
.menu {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 60px;
  flex-wrap: wrap;
}

/* карточки */
.card {
  width: 220px;
  height: 280px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 18px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  overflow: hidden;
  transition: 0.4s;
  position: relative;
}

.card:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 0 25px rgba(170,120,255,0.5);
}

/* картинка */
.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

/* текст */
.card h3 {
  margin: 10px;
}

.card p {
  font-size: 12px;
  margin: 10px;
  opacity: 0.8;
}

/* кнопка */
.btn {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 16px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #7b4dff, #ff6bd6);
  color: white;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: 0.3s;
}

.btn:hover {
  transform: translateX(-50%) scale(1.1);
}

/* след палочки */
.spark {
  position: absolute;
  width: 6px;
  height: 6px;
  background: radial-gradient(circle, #fff, #b388ff);
  border-radius: 50%;
  pointer-events: none;
  animation: fade 0.8s forwards;
}

@keyframes fade {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.2); opacity: 0; }
}
</style>
</head>

<body>

<h1>✨ Magic Library Menu</h1>

<div class="menu">

  <div class="card">
    <img src="https://picsum.photos/300/200?1">
    <h3>Forbidden Love</h3>
    <p>Истории, которые нельзя было читать вслух.</p>
    <button class="btn">Enter</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/200?2">
    <h3>Dark Magic</h3>
    <p>Тайные заклинания и запретные знания.</p>
    <button class="btn">Enter</button>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/200?3">
    <h3>Healing Stories</h3>
    <p>Тёплые истории о восстановлении и свете.</p>
    <button class="btn">Enter</button>
  </div>

</div>

<script>
// звёздочки на фоне
for (let i = 0; i < 60; i++) {
  let s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random() * window.innerWidth + "px";
  s.style.top = Math.random() * window.innerHeight + "px";
  s.style.animationDuration = (3 + Math.random() * 5) + "s";
  document.body.appendChild(s);
}

// эффект "волшебной палочки" (клик)
document.addEventListener("mousemove", (e) => {
  let spark = document.createElement("div");
  spark.className = "spark";
  spark.style.left = e.pageX + "px";
  spark.style.top = e.pageY + "px";
  document.body.appendChild(spark);

  setTimeout(() => spark.remove(), 800);
});
</script>

</body>
</html>
