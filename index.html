<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dramione Library</title>
    <!-- Подключение шрифтов и иконок -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-dark: #0b070d;
            --panel-bg: rgba(20, 14, 24, 0.75);
            --panel-border: rgba(140, 110, 80, 0.25);
            --gold: #b39263;
            --gold-bright: #e6cb9e;
            --text-light: #d1cbd4;
            --text-muted: #847a88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Comfortaa', sans-serif;
            font-size: 13px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            background-image: radial-gradient(circle at 50% 30%, rgba(50, 25, 60, 0.2), transparent 70%);
        }

        /* --- БОКОВОЕ МЕНЮ (ЛЕВАЯ ПАНЕЛЬ) --- */
        .sidebar {
            width: 260px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            text-align: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 20px;
        }

        .logo-d {
            font-family: 'Cinzel', serif;
            font-size: 42px;
            color: var(--gold);
            line-height: 1;
            text-shadow: 0 0 10px rgba(179, 146, 99, 0.3);
        }

        .logo-title {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 5px;
            color: var(--text-light);
        }

        .logo-subtitle {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-light);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .nav-item a:hover {
            background: rgba(179, 146, 99, 0.1);
            color: var(--gold-bright);
        }

        .nav-item i {
            color: var(--gold);
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .nav-text-ru {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .sidebar-quote {
            margin-top: auto;
            border-top: 1px solid var(--panel-border);
            padding-top: 20px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- ОСНОВНОЙ КОНТЕНТ --- */
        .main-container {
            flex: 1;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* --- ВЕРХНИЙ БАННЕР --- */
        .hero-section {
            text-align: center;
            position: relative;
            padding: 40px 20px;
            background: linear-gradient(to bottom, rgba(20,14,24,0), rgba(20,14,24,0.6));
            border-radius: 8px;
        }

        .welcome-text {
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 46px;
            color: var(--gold);
            letter-spacing: 4px;
            margin: 10px 0 5px;
            line-height: 1.1;
        }

        .cursive-title {
            font-family: 'Pinyon Script', cursive;
            font-size: 52px;
            color: var(--gold-bright);
            display: block;
            margin-top: -15px;
            margin-bottom: 15px;
        }

        .hero-desc {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 450px;
            margin: 0 auto 25px;
        }

        .btn-enter {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold-bright);
            font-family: 'Cinzel', serif;
            padding: 10px 25px;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 2px;
        }

        .btn-enter:hover {
            background: var(--gold);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(179, 146, 99, 0.4);
        }

        /* --- БЛОК С КАРТОЧКАМИ (OUR MOMENTS) --- */
        .section-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .section-header {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .section-header::before, .section-header::after {
            content: "♦ \2212";
            font-size: 10px;
            color: var(--panel-border);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .moment-card {
            background: rgba(10, 6, 12, 0.6);
            border: 1px solid rgba(140, 110, 80, 0.15);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            cursor: pointer;
        }

        .moment-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
        }

        .card-img {
            width: 100%;
            height: 120px;
            background: #1a1320; /* Заглушка вместо фото */
            position: relative;
            background-size: cover;
            background-position: center;
        }

        /* Временные атмосферные градиенты вместо реальных кадров фильма */
        .img-1 { background: linear-gradient(45deg, #1f1124, #3c2347); }
        .img-2 { background: linear-gradient(45deg, #111b24, #233847); }
        .img-3 { background: linear-gradient(45deg, #241111, #472323); }

        .card-body {
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .card-title {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .card-date {
            font-size: 10px;
            color: var(--text-muted);
        }

        .card-heart {
            position: absolute;
            right: 12px;
            bottom: 12px;
            color: var(--text-muted);
            font-size: 11px;
            transition: color 0.3s;
        }

        .card-heart:hover {
            color: #a04040;
        }

        /* --- ПЛЕЕР И ПИСЬМО (НИЖНИЙ РЯД) --- */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Музыкальный плеер */
        .player-panel {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-cover {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #442255, #110518);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
        }

        .player-info {
            flex: 1;
        }

        .track-status {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .track-title {
            font-size: 14px;
            color: var(--text-light);
            font-weight: bold;
            margin: 2px 0;
        }

        .track-author {
            font-size: 11px;
            color: var(--text-muted);
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .timeline-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
        }

        .progress-current {
            width: 35%;
            height: 100%;
            background: var(--gold);
            border-radius: 2px;
