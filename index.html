<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dramione Library</title>
<style>

body {
    margin: 0;
    overflow: hidden;
    background: #0f0a07;
    font-family: "Georgia", serif;
    color: #d6b25e;
}

/* ===== PORTAL ===== */

#portal {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1a120d, #0f0a07 70%);
}

/* dust */
.dust {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(214,178,94,0.6);
    border-radius: 50%;
    animation: float 8s linear infinite;
    opacity: 0.4;
}

@keyframes float {
    0% { transform: translateY(100vh); }
    100% { transform: translateY(-10vh); }
}

/* title */
#title {
    position: absolute;
    top: 42%;
    width: 100%;
    text-align: center;
    font-size: 48px;
    letter-spacing: 3px;
    opacity: 0;
    transform: scale(1.05);
    transition: 2.5s ease;
}

#subtitle {
    position: absolute;
    top: 52%;
    width: 100%;
    text-align: center;
    font-size: 16px;
    opacity: 0;
    transition: 3s ease;
    letter-spacing: 2px;
}

/* golden line */
#line {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d6b25e, transparent);
    transform: translateX(-50%);
    transition: 2.5s ease;
}

/* enter */
#enter {
    position: absolute;
    top: 60%;
    width: 100%;
    text-align: center;
    font-size: 14px;
    opacity: 0;
    cursor: pointer;
    transition: 2s ease;
}

/* fade out transition */
.fadeOut {
    animation: vanish 2s forwards;
}

@keyframes vanish {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }
}

/* ===== LIBRARY ===== */

#library {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #120b08;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: 2s ease;
    font-size: 22px;
    letter-spacing: 2px;
}

</style>
</head>

<body>

<div id="portal"></div>

<div id="title">Dramione Library</div>
<div id="line"></div>
<div id="subtitle">forbidden archive of memory</div>
<div id="enter">Enter the Archive</div>

<div id="library">THE ARCHIVE IS OPEN</div>

<script>

// ===== DUST =====
for (let i = 0; i < 120; i++) {
    let d = document.createElement("div");
    d.className = "dust";
    d.style.left = Math.random() * 100 + "vw";
    d.style.animationDuration = (6 + Math.random() * 6) + "s";
    d.style.opacity = Math.random() * 0.5;
    document.body.appendChild(d);
}

// ===== SEQUENCE =====
setTimeout(() => {
    document.getElementById("title").style.opacity = 1;
}, 1200);

setTimeout(() => {
    document.getElementById("line").style.width = "40%";
}, 2500);

setTimeout(() => {
    document.getElementById("subtitle").style.opacity = 0.7;
}, 3200);

setTimeout(() => {
    document.getElementById("enter").style.opacity = 0.8;
}, 4200);

// ===== ENTER =====
document.getElementById("enter").onclick = () => {

    document.getElementById("portal").classList.add("fadeOut");
    document.getElementById("title").classList.add("fadeOut");
    document.getElementById("line").classList.add("fadeOut");
    document.getElementById("subtitle").classList.add("fadeOut");
    document.getElementById("enter").classList.add("fadeOut");

    setTimeout(() => {
        document.getElementById("library").style.opacity = 1;
    }, 1800);

};

</script>

</body>
</html>
